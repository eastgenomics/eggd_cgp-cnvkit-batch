name: tests

# L0–L2: static checks, unit tests and argv-contract tests.
# No Docker, validation data or DNAnexus access needed; L3–L6 run manually.
on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: L0–L2 (static, unit, pipeline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install shellcheck and test dependencies
        # shellcheck: the Ubuntu 24.04 archive package (apt verifies its signature), pinned to one version.
        # uv: version and artifact hashes pinned in requirements-bootstrap.txt, verified by pip --require-hashes;
        # it then installs the test requirements by hash (requirements-test.txt is compiled with hashes).
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck=0.9.0-1
          python -m pip install --require-hashes --no-deps --only-binary :all: -r requirements-bootstrap.txt
          uv pip install --system --require-hashes -r requirements-test.txt
      - name: Validate dxapp.json
        run: python -m json.tool dxapp.json > /dev/null
      - name: Run L0–L2
        # -rs lists every skip; the shellcheck test fails instead of skipping when CI is set
        run: python -m pytest -m "static or unit or pipeline" -rs
