[pytest]
testpaths = tests
pythonpath = tests/pipeline
addopts = -ra --strict-markers
markers =
    static: L0 static checks (shellcheck, dxapp.json); no Docker, data or dx
    unit: L1 unit tests of the bundled Python scripts on synthetic fixtures
    pipeline: L2 argv-contract tests of the app under PATH stubs; no Docker, data or dx
    validation: L3 equivalence against the validation scripts and data (needs $CNVKIT_VALIDATION_DATA)
    docker: needs Docker and the cgp-cnvkit:1.0.0 image
